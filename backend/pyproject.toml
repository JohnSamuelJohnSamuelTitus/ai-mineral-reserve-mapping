[project]
name = "ai-mineral-prospectivity-backend"
version = "0.2.0"
description = "Backend & geospatial data infrastructure for AI Mineral Reserve Mapping Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.35",
    "alembic>=1.14.0",
    "httpx>=0.27.2",
    "shapely>=2.0.6",
    "pyproj>=3.7.0",
    "geopandas>=1.0.1",
    "rasterio>=1.4.0",
    "scikit-learn>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]
